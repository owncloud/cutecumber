[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutecumber"
version = "0.1.0"
description = "Squish-compatible BDD GUI test runner for Qt Widgets and Qt Quick applications"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["gherkin-official>=29,<30"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cutecumber = "cutecumber.__main__:main"

[tool.setuptools]
# cutecumber/shim/ holds the Squish-named modules (squish, object, objectmaphelper,
# ...). It is package data, no package: the runner puts the directory first on
# sys.path, so its modules are imported by their bare names only.
packages = ["cutecumber"]

[tool.setuptools.package-data]
cutecumber = ["shim/*.py"]

[tool.black]
# Squish suites mix quote styles; the runner keeps them as written
skip-string-normalization = true
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = [".", "cutecumber/shim", "tests"]
testpaths = ["tests"]
