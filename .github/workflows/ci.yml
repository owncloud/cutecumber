name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: Probe (Qt 6.8)
    runs-on: ubuntu-latest
    env:
      QT_VERSION: "6.8.3"
      QT_ARCH: linux_gcc_64
      QT_ARCH_DIR: gcc_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-aqtinstall-3.3.0

      # aqtinstall directly, instead of a third-party action outside the org's actions allowlist.
      # The desktop essentials include qtdeclarative: Qt Quick, Quick Controls 2 and Quick Widgets.
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall==3.3.0"
          python -m aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" --outputdir "$RUNNER_TEMP/qt"

      - name: Use Qt
        run: echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/qt/$QT_VERSION/$QT_ARCH_DIR" >> "$GITHUB_ENV"

      - name: Install build tools and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon0 libfontconfig1

      - name: Configure
        run: cmake -S probe -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      # tst_quick is skipped with only a CMake warning when Qt Quick Controls 2 is missing
      - name: Check that the Qt Quick tests are registered
        run: ctest --test-dir build -N | grep -oE 'cutecumber-tst_[a-z_]+' | grep -qx cutecumber-tst_quick

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  harness:
    name: Runner (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install "./[test]" "black==24.3.*" "pylint==3.2.*"

      - name: Test
        run: python -m pytest

      - name: Black
        run: python -m black --check --diff .

      - name: Pylint
        run: python -m pylint cutecumber cutecumber/shim/*.py tests/*.py

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: python -m pip install "zizmor==1.33.1"

      - name: Check the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
